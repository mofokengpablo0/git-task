# Docker Compose is optional for this project.
# If Docker is unavailable, install MariaDB locally and use the local server
# with the environment variables documented in README.md and STARTUP.md.
version: '3.8'

services:
  mariadb:
    image: mariadb:11.0
    container_name: newsapp_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "PABLOSAAS"
      MARIADB_DATABASE: "news_db"
      MARIADB_USER: "root"
      MARIADB_PASSWORD: "PABLOSAAS"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
